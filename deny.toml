# cargo-deny 0.20.2 policy (ADR 0001 §8.1). parity-contracts/rust/deny.toml is the same policy plus MIT-0, which only its tool needs.
[graph]
all-features = false

[advisories]
# Vulnerabilities always fail. Yanked crates fail; unmaintained ones fail for direct
# dependencies only.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# The same allow-list as parity-interaction-engine; not every crate set uses every licence.
unused-allowed-license = "allow"
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# No OpenSSL anywhere: rustls only (PLAN, "No OpenSSL in IE").
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
