[package]
name = "ie-telephony-client"
description = "interaction-engine's client of parity-telephony-controller (telephony.v1): delivery, acks, fencing, lost contact (ADR 0003)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# declare_node_dead: only step 7's audited admin command turns this on (ADR 0003 R1-11).
operator-override = []

[dependencies]
ie-obs.workspace = true
parity-proto.workspace = true
prost.workspace = true
tonic.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
fastrand.workspace = true
uuid.workspace = true
serde.workspace = true

[dev-dependencies]
ie-telephony-client = { path = ".", features = ["operator-override"] }
ie-obs = { workspace = true, features = ["testing"] }
parity-proto = { workspace = true, features = ["server"] }
proptest.workspace = true
prost-reflect.workspace = true
serde_json.workspace = true
tokio-stream.workspace = true
tempfile.workspace = true

[lints]
workspace = true
