[package]
name = "interaction-engine"
description = "parity-interaction-engine: the call runtime (step 0: lifecycle, readiness, drain, logs, metrics; step 3: DEMO level 0 through TC; step 4: the interaction core, IVR and CDR)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "parity-interaction-engine"
path = "src/main.rs"

[dependencies]
ie-core.workspace = true
ie-obs.workspace = true
ie-telephony-client.workspace = true
ie-routing-client.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
fastrand.workspace = true
getrandom.workspace = true
opentelemetry.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
ie-obs = { path = "../ie-obs", features = ["testing"] }
tempfile.workspace = true
# The telephony client's in-process TC (tests/call_end.rs reuses its tests/mock).
parity-proto = { workspace = true, features = ["server"] }

[lints]
workspace = true
